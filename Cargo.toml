[workspace]
resolver = "3"
members = [
    "crates/model",
    "crates/collector",
    "crates/db",
    "crates/api",
    "crates/geo",
    "crates/pcap",
    "crates/server",
    "crates/flowgen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
model = { path = "crates/model" }
collector = { path = "crates/collector" }
db = { path = "crates/db" }
api = { path = "crates/api" }
geo = { path = "crates/geo" }
pcap = { path = "crates/pcap" }

tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["fs", "trace", "cors"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
anyhow = "1"
futures = "0.3"
maxminddb = "0.24"
indexmap = { version = "2", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
